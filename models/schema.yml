
version: 2

sources:
  - name: raw
    schema: gz_raw_data
    description: Raw data coming from the Greenweez operational database

    tables:
      - name: sales
        identifier: raw_gz_sales
        description: Sales of Greenweez / one row per product_id per orders_id
        columns:
          - name: date_date
            description: Date of purchase

          - name: orders_id
            description: Unique identifier of the order

          - name: products_id
            description: Unique identifier of the product

          - name: revenue
            description: Revenue generated for the product

          - name: quantity
            description: Quantity of product sold

        tests:
          - unique:
              column_name: "(orders_id || '-' || products_id)"

      - name: product
        identifier: raw_gz_product
        description: Products of Greenweez
        columns:
          - name: products_id
            description: Unique identifier of the product
            tests:
              - not_null
              - unique

          - name: purchse_price
            description: Purchase price of the product (raw spelling)

      - name: ship
        identifier: raw_gz_ship
        description: Shipping information for Greenweez orders
        columns:
          - name: ship_id
            description: Unique identifier of the shipment
            tests:
              - not_null
              - unique

          - name: shipping_fee
            description: Shipping fee charged to the customer

          - name: shipping_fee_1
            description: Duplicate shipping fee column (same value as shipping_fee)

          - name: ship_cost
            description: Internal logistics cost of shipping

