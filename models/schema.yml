
version: 2

sources:
  - name: raw
    schema: gz_raw_data
    description: "Raw data coming from BigQuery"

    tables:
      - name: sales
        identifier: raw_gz_sales
        description: "Raw sales data"
        columns:
          - name: date_date
            description: "Date of the sale"

          - name: orders_id
            description: "Unique order identifier"

          - name: pdt_id
            description: "Product identifier"

          - name: revenue
            description: "Revenue generated by the order"

          - name: quantity
            description: "Quantity of products sold"

      - name: ship
        identifier: raw_gz_ship
        description: "Raw shipping data"
        columns:
          - name: orders_id
            description: "Order identifier"

          - name: shipping_fee
            description: "Shipping fee charged to the customer"

          - name: shipping_fee_1
            description: "Additional shipping fee"

          - name: logCost
            description: "Logistics cost"

          - name: ship_cost
            description: "Shipping cost"

      - name: product
        identifier: raw_gz_product
        description: "Raw product data"
        columns:
          - name: products_id
            description: "Unique product identifier"

          - name: purchSE_PRICE
            description: "Purchase price of the product"




 

      

